; ─────────────────────────────────────────────────────────────────────────────
; PlatformIO project: Rotary Encoder + ILI9341 240x320 SPI LCD on ESP32
; Framework: Arduino (FreeRTOS via ESP32 Arduino core)
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

;board_build.mcu = esp32
monitor_filters = esp32_exception_decoder

upload_port = /dev/tty.usbserial-0001
monitor_port = /dev/tty.usbserial-0001
upload_speed = 230400
;debug_tool = minimodule
;debug_init_break = tbreak loop
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43          ; ILI9341 / ST7789 / ST7735 driver
    bblanchon/ArduinoJson @ ^7
    ;paulstoffregen/XPT2046_Touchscreen @ ^1.4  ; XPT2046 touch controller
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ── TFT_eSPI driver selection (edit to match your module) ──
    -DUSER_SETUP_LOADED=1
    ;-DILI9341_DRIVER=1
    -DILI9488_DRIVER=1
    ; ── TFT size (ILI9488 native PORTRAIT dimensions - rotation swaps this
    ;    to 480x320 landscape at runtime via tft.setRotation(), don't set the
    ;    landscape numbers here directly) ──
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    ; ── SPI pins (VSPI) ──
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=0
    -DTFT_DC=26
    -DTFT_RST=25
    -DTFT_MISO=19
    -DTOUCH_CS=16
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; ── FreeRTOS stack tuning ──
    ;-DconfigMINIMAL_STACK_SIZE=2048
    ; ── TFT_eSPI built-in fonts ────────────────────────────────────────────
    ; Every font you use must be enabled here or drawString() renders nothing.
    ; Font 1 = 8px  Font 2 = 16px  Font 4 = 26px
    ; Font 6 = 48px digits   Font 7 = 48px 7-seg style   Font 8 = 75px digits
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
